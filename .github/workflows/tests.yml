name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU PyTorch and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Check imports
        run: python -c "import robustdrive, torch, torchvision, cv2; print(robustdrive.__version__)"
      - name: Lint
        run: python -m ruff check src scripts tests
      - name: Unit and small synthetic integration tests
        run: python -m pytest -q
      - name: CLI entry points
        run: python scripts/check_cli.py
