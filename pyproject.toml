[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robustdrive"
version = "0.1.0"
description = "Behavioral cloning, visual robustness, and uncertainty for simulator steering"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "torch>=2.5,<3", "torchvision>=0.20,<1", "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5", "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4", "Pillow>=10.4,<13",
  "PyYAML>=6,<7", "tqdm>=4.66,<5", "scipy>=1.13,<2",
  "aiohttp>=3.11,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
